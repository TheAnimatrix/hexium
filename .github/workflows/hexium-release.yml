name: Hexium release

# Builds Hexium for Windows (x64, ARM64: executables + installers), Linux
# (x64, ARM64: executables, .deb, .rpm) and Apple silicon macOS (DMG) through
# upstream's reusable build workflows, then publishes them as one GitHub
# release. Each build's version is Hex's with this workflow's run number
# (3.3.0-hexium.12), so every release installs into its own version folder,
# and the number only grows, so Linux packages order too. The
# release carries its changelog (hexium/release-notes.py: Hexium's patches
# and Hex's commits since the previous release) and stable.json
# (hexium/release-manifest.py), the manifest Hexium's in-app updater reads
# through releases/latest/download. Builds are unsigned; the updater checks
# each download against the manifest's size and SHA-256.
on:
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexium-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      version: ${{ steps.resolve.outputs.version }}
      hex-version: ${{ steps.resolve.outputs.hex-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: resolve
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short=$(git rev-parse --short=7 HEAD)"
            hex=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hex") | .version')
            echo "hex-version=$hex"
            # A rerun keeps its run number, so it rebuilds the same version.
            echo "version=$hex-hexium.$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: resolve
    uses: ./.github/workflows/build-desktop.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.version }}
      artifact-prefix: hexium-${{ needs.resolve.outputs.short }}
      retention-days: 7

  installers:
    needs: [resolve, desktop]
    uses: ./.github/workflows/windows-installers.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.version }}
      pattern: hexium-${{ needs.resolve.outputs.short }}-windows-*
      digests: hexium-${{ needs.resolve.outputs.short }}-windows-x86_64=${{ needs.desktop.outputs.windows-x64-digest }} hexium-${{ needs.resolve.outputs.short }}-windows-aarch64=${{ needs.desktop.outputs.windows-arm64-digest }}
      artifact-name: hexium-${{ needs.resolve.outputs.short }}-windows-installers
      retention-days: 7

  macos:
    name: macOS arm64
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 90
    env:
      HEX_RELEASE_UNSIGNED: "1"
      HEX_VERSION: ${{ needs.resolve.outputs.version }}
      DMG: hexium-${{ needs.resolve.outputs.version }}-macos-arm64.dmg
      # What the in-app updater downloads and swaps in (src/updater/macos.rs).
      ZIP: hexium-${{ needs.resolve.outputs.version }}-macos-arm64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: hexium-release
          cache-on-failure: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build Hexium.app
        run: |
          scripts/setup.sh
          bundle=$(scripts/build-app.sh)
          "$bundle/Contents/MacOS/hex" --version
          scripts/smoke-macos-app.sh "$bundle"
          mkdir -p dist/staging
          /usr/bin/ditto "$bundle" "dist/staging/$(basename "$bundle")"
          ln -s /Applications dist/staging/Applications
          hdiutil create -quiet -fs APFS -format ULFO -volname "Hexium" -srcfolder dist/staging "dist/$DMG"
          /usr/bin/ditto -c -k --keepParent "$bundle" "dist/$ZIP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hexium-${{ needs.resolve.outputs.short }}-macos-arm64
          path: |
            dist/${{ env.DMG }}
            dist/${{ env.ZIP }}
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [resolve, desktop, installers, macos]
    # macOS runners are sometimes unavailable; Windows and Linux still ship,
    # and a rerun of the macOS job adds the DMG and the update ZIP (and the
    # manifest's macOS targets) to the same release.
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.installers.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHORT: ${{ needs.resolve.outputs.short }}
      VERSION: ${{ needs.resolve.outputs.version }}
      HEX_VERSION: ${{ needs.resolve.outputs.hex-version }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      # The changelog compares this release's history with the previous
      # release's, so it needs every commit and tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: hexium-${{ needs.resolve.outputs.short }}-*
          path: in
          merge-multiple: true
      - name: Name the files after Hexium and publish
        run: |
          mkdir out
          find in -type f ! -name 'SHA256SUMS*' | while read -r f; do
            name=$(basename "$f")
            cp "$f" "out/${name/#hex-/hexium-}"
          done
          (cd out && sha256sum * > SHA256SUMS)
          ls -la out
          # Builds from before in-app updates find a release by the commit
          # after "-hexium." in its tag, so the tag keeps that shape.
          tag="v$VERSION-$SHORT"
          # The newest published release other than this one (a rerun's own).
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 30 \
            --json tagName -q '.[].tagName' | grep -vxF "$tag" | head -n 1 || true)
          python3 -I hexium/release-notes.py "$SHA" "$VERSION" "$HEX_VERSION" ${previous:+"$previous"} > notes.md
          cat notes.md
          python3 -I hexium/release-manifest.py out "$VERSION" "$tag" "$GITHUB_RUN_NUMBER" > stable.json
          cat stable.json
          # GitHub answers 5xx now and then; retry creating as well as uploading.
          for attempt in 1 2 3 4 5; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "Hexium $VERSION ($SHORT)" \
              --notes-file notes.md && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 15))
          done
          # A rerun (one that adds the macOS build, say) refreshes the notes.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          # Uploads right after creation can 404 while the release settles.
          # The manifest goes last, so it never names a file not there yet.
          for f in out/* stable.json; do
            for attempt in 1 2 3 4 5; do
              gh release upload "$tag" "$f" --clobber --repo "$GITHUB_REPOSITORY" && break
              [ "$attempt" = 5 ] && exit 1
              sleep $((attempt * 10))
            done
          done
