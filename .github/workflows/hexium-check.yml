name: Hexium check

# Upstream's Linux suite (check-linux.yml's test job, without the Nix
# packaging Hexium doesn't ship): format, every unit and golden test, and a
# real dictation through a virtual microphone. Test failures count only when
# Hexium causes them (hexium/check-tests.sh reruns them on upstream). Runs on pull requests, and on
# each weekly sync's candidate before it becomes dev (hexium-sync.yml).
on:
  pull_request:
    branches: [dev]
  workflow_call:
    inputs:
      sha:
        description: The commit to test
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexium-check-${{ inputs.sha || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      SOURCE_DATE_EPOCH: "0"
      BLA_VENDOR: OpenBLAS
      OPENSSL_NO_VENDOR: "1"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0 # check-tests.sh compares with the upstream commit under the patches
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: hexium-check
          cache-on-failure: true
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-nextest
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config python3 libasound2-dev \
            libssl-dev libgtk-3-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libfontconfig1-dev libfreetype-dev \
            libxcursor-dev libxi-dev libxrandr-dev libopenblas-dev libvulkan-dev \
            glslc libshaderc-dev xvfb xauth x11-xserver-utils \
            sway wl-clipboard wtype dbus-x11 jq mesa-vulkan-drivers \
            pulseaudio pulseaudio-utils libasound2-plugins xdotool \
            fonts-noto-core
      - run: cargo fmt --all --check
      - name: Tests, judged against upstream
        run: hexium/check-tests.sh --bin hex
      - run: cargo nextest run --locked --profile ci -p scrawl-router
      - name: Upload renders that missed their goldens
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: golden-actual
          path: /tmp/rune-settings-*-actual.png
          if-no-files-found: ignore
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/hex-model-test/models
          key: linux-dictation-model-${{ hashFiles('src/transcription_models.rs') }}
      - name: Dictate through a virtual microphone
        env:
          HEX_APPLICATION_SUPPORT_DIR: ${{ runner.temp }}/hex-model-test
        run: |
          cargo build --locked --bin hex
          target/debug/hex model install
          curl --fail --location --silent --show-error --max-time 60 \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/b0a11594aec50892a02cd8d129eee2dfe93a8bb8/samples/jfk.wav \
            --output "$RUNNER_TEMP/jfk.wav"
          printf '%s  %s\n' \
            59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e \
            "$RUNNER_TEMP/jfk.wav" | sha256sum --check
          scripts/test-linux-dictation.sh target/debug/hex \
            "$HEX_APPLICATION_SUPPORT_DIR/models/parakeet-unified-en-0.6b-Q8_0.gguf" \
            "$RUNNER_TEMP/jfk.wav"
